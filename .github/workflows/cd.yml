name: CD — Build & Push Docker Images

on:
  push:
    branches: [main]      # Deploy only from main
    tags:
      - "v*.*.*"          # Also trigger on version tags (v1.0.0, v2.1.3, …)

# Only allow one deployment at a time
concurrency:
  group: cd-production
  cancel-in-progress: false  # Never cancel a running deploy

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ecommerce-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ecommerce-frontend

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Compute metadata (tags, labels) for both images
  # ────────────────────────────────────────────────────────────────────────────
  metadata:
    name: 🏷️ Compute Image Tags
    runs-on: ubuntu-latest
    outputs:
      backend-tags:  ${{ steps.backend-meta.outputs.tags }}
      backend-labels: ${{ steps.backend-meta.outputs.labels }}
      frontend-tags: ${{ steps.frontend-meta.outputs.tags }}
      frontend-labels: ${{ steps.frontend-meta.outputs.labels }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔖 Compute version string
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏷️ Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Backend Image → GHCR
  # ────────────────────────────────────────────────────────────────────────────
  push-backend:
    name: 🐍 Build & Push Backend
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatically provided by GitHub

      - name: 🚀 Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ needs.metadata.outputs.backend-tags }}
          labels: ${{ needs.metadata.outputs.backend-labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ needs.metadata.outputs.version }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Frontend Image → GHCR
  # ────────────────────────────────────────────────────────────────────────────
  push-frontend:
    name: ⚛️ Build & Push Frontend
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ needs.metadata.outputs.frontend-tags }}
          labels: ${{ needs.metadata.outputs.frontend-labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}
            BUILD_VERSION=${{ needs.metadata.outputs.version }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy to production server via SSH (optional — configure secrets)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🌍 Deploy to Production
    runs-on: ubuntu-latest
    needs: [push-backend, push-frontend]
    environment: production   # requires approval if configured in GitHub settings
    # Uncomment this job once your server secrets are configured:
    # if: github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🌍 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        # Required secrets (set in GitHub → Settings → Secrets → Actions):
        #   DEPLOY_HOST     — your server IP or hostname
        #   DEPLOY_USER     — SSH username (e.g. ubuntu)
        #   DEPLOY_SSH_KEY  — private SSH key (ed25519 or RSA)
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ecommerce

            # Pull the latest .env from server (never store in repo)
            # (your .env should already be on the server)

            # Pull newest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            docker compose pull

            # Rolling restart — DB never goes down
            docker compose up -d --no-deps postgres
            sleep 5
            docker compose up -d --no-deps backend
            docker compose up -d --no-deps frontend

            # Clean up dangling images
            docker image prune -f

      - name: 🔔 Notify on success
        if: success()
        run: |
          echo "✅ Deployment ${{ needs.metadata.outputs.version }} complete!"

      - name: 🔔 Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
